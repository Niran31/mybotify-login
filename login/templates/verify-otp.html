<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP | MyBotify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* Page wrapper */
        body {
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Center container */
        .otp-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card */
        .otp-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 36px 32px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.12);
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .otp-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: #25272b;
            margin-bottom: 6px;
        }

        .otp-card p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 26px;
        }

        /* OTP input */
        .otp-input {
            width: 100%;
            padding: 14px;
            font-size: 22px;
            letter-spacing: 6px;
            text-align: center;
            border-radius: 14px;
            border: 1px solid #d1d5db;
            outline: none;
            transition: 0.2s ease;
        }

        .otp-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
        }

        /* Button */
        .verify-btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: #10b981;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .verify-btn:hover {
            background: #059669;
        }

        /* Footer */
        .otp-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }

        .otp-footer a {
            color: #10b981;
            font-weight: 600;
            text-decoration: none;
        }

        .otp-footer a:hover {
            text-decoration: underline;
        }

        /* Logo */
        .otp-logo {
            position: fixed;
            top: 24px;
            left: 24px;
            font-size: 20px;
            font-weight: 700;
            color: #10b981;
            text-decoration: none;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<!-- Logo -->
<a href="{{ url_for('home_page') }}" class="otp-logo">⬆ MyBotify</a>

<!-- Page Content -->
<div class="otp-page">
    <div class="otp-card">

        <h2>Verify Your Email</h2>
        <p>We’ve sent a 6-digit OTP to your email address</p>

        <form id="otpForm">
            <input type="hidden" id="email"
                   value="{{ request.args.get('email') }}">

            <input
                type="text"
                id="otp"
                class="otp-input"
                placeholder="Enter OTP"
                maxlength="6"
                required
            >

            <button type="submit" class="verify-btn">
                Verify OTP
            </button>
        </form>

        <div class="otp-footer">
            Didn’t receive OTP?
            <a href="#" id="resendOtp">Resend</a>
        </div>

    </div>
</div>

<!-- Alerts -->
<div id="alertContainer"></div>

<!-- JS -->
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

<script>
    const form = document.getElementById('otpForm');
    const email = document.getElementById('email').value;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const otp = document.getElementById('otp').value.trim();

        if (!otp || otp.length !== 6) {
            showAlert('Please enter a valid 6-digit OTP', 'error');
            return;
        }

        try {
            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp })
            });

            const data = await res.json();

            if (res.ok) {
                showAlert('Email verified successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                showAlert(data.message || 'Invalid OTP', 'error');
            }
        } catch {
            showAlert('Server error. Try again later.', 'error');
        }
    });

    document.getElementById('resendOtp').addEventListener('click', async (e) => {
        e.preventDefault();

        try {
            const res = await fetch('/api/resend-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (res.ok) {
                showAlert('OTP resent successfully', 'success');
            } else {
                showAlert(data.message || 'Failed to resend OTP', 'error');
            }
        } catch {
            showAlert('Server error. Try again later.', 'error');
        }
    });
</script>

</body>
</html>
