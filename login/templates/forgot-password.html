<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MyBotify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page">
    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <span class="logo-text">MyBotify</span>
        </div>

        <!-- Forgot Password Modal -->
        <div class="auth-modal">
            <div class="modal-header">
                <h2>Forgot your Password?</h2>
                <p class="modal-subtitle">Enter your email address and a password reset link will be sent to you.</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="reset-email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="reset-email" name="email" placeholder="Your Email" required>
                        <span class="input-icon">✉️</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Send reset Link</button>

                <div class="auth-switch">
                    Remembered your password? <a href="{{ url_for('login_page') }}">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Modal (Hidden by default) -->
    <div id="successModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Check your email</h3>
            <p>If this email exists, a reset link has been sent</p>
            <button onclick="closeSuccessModal()" class="btn btn-primary">OK</button>
        </div>
    </div>

    <!-- Alert Messages -->
    <div id="alertContainer"></div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            if (modal) modal.style.display = 'none';
            // Use replace so the user cannot navigate back to the success screen
            window.location.replace("{{ url_for('login_page') }}");
        }
    </script>
</body>

</html>
