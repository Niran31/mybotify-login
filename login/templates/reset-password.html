<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MyBotify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page">
    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="MyBotify"
                style="height: 32px; width: auto;">
        </div>

        <!-- Reset Password Modal -->
        <div class="auth-modal">
            <div class="modal-header">
                <h2>Reset Your Password</h2>
                <p class="modal-subtitle">Enter your new password below.</p>
            </div>

            <!-- Reset Password Form -->
            <form id="resetPasswordForm" class="auth-form">
                <input type="hidden" id="reset-token" name="token" value="">

                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="new-password" name="password" placeholder="Enter new password"
                            required minlength="6">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" name="confirm_password"
                            placeholder="Confirm new password" required minlength="6">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Reset Password</button>

                <div class="auth-switch">
                    <a href="{{ url_for('login_page') }}">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Modal (Hidden by default) -->
    <div id="successModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Password Reset Successful!</h3>
            <p>Your password has been updated. You can now login with your new password.</p>
            <button onclick="goToLogin()" class="btn btn-primary">Go to Login</button>
        </div>
    </div>

    <!-- Alert Messages -->
    <div id="alertContainer"></div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            document.getElementById('reset-token').value = token;
        } else {
            showAlert('Invalid or missing reset token', 'error');
        }

        // Show alert function
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                    <span>${type === 'error' ? '✕' : '✓'}</span>
                    <span>${message}</span>
                `;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // Handle form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const token = document.getElementById('reset-token').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('successModal').style.display = 'flex';
                } else {
                    showAlert(data.message || 'Failed to reset password', 'error');
                }
            } catch (error) {
                showAlert('An error occurred. Please try again.', 'error');
            }
        });

        function goToLogin() {
            window.location.replace('/login');
        }
    </script>
</body>

</html>
